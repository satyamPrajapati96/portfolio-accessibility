<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Contact Satyam Prajapati for web development and project-related inquiries."
    >

    <meta name="author" content="Satyam Prajapati">

    <title>Contact | Satyam Prajapati</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>

    <main>

        <section aria-labelledby="contact-title">

            <h1 id="contact-title">Contact Me</h1>

            <p>
                If you would like to get in touch, fill out the form below.
            </p>

            <form action="#" method="post">

                <div>
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div>
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div>
                    <label for="subject">Subject</label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                    >
                </div>

                <div>
                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>
                </div>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 Satyam Prajapati. All rights reserved.
        </p>
    </footer>

</body>

</html>
